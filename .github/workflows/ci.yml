name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Protocol workspace (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  desktop:
    name: Desktop app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Linux system dependencies (webkit2gtk for Tauri)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libudev-dev
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Build frontend
        working-directory: apps/desktop
        run: npm run build
      - name: Check Tauri backend
        working-directory: apps/desktop/src-tauri
        run: cargo check

  audit:
    name: Dependency audits (RustSec + npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo audit (protocol workspace + desktop lockfiles)
        run: |
          cargo install cargo-audit --locked
          cargo audit
          cargo audit --file apps/desktop/src-tauri/Cargo.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit (production dependencies)
        working-directory: apps/desktop
        run: npm audit --omit=dev --audit-level=high
