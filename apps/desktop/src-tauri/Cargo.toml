# Standalone project (empty [workspace] below): the protocol workspace must
# build and test without webkit/GTK system libraries, so the Tauri shell is
# deliberately kept out of it.

[package]
name = "motodiag-desktop"
description = "MotoDiag desktop app (Tauri shell)"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/eugibart/eugibart"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4.7"

motodiag-transport = { path = "../../../crates/transport" }
motodiag-kwp2000 = { path = "../../../crates/protocol-kwp2000" }
motodiag-ecu-defs = { path = "../../../crates/ecu-defs" }
motodiag-ecu-sim = { path = "../../../crates/ecu-sim" }
motodiag-app-core = { path = "../../../crates/app-core" }
