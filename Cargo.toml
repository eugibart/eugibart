[workspace]
resolver = "2"
members = [
    "crates/transport",
    "crates/protocol-kwp2000",
    "crates/protocol-can",
    "crates/ecu-defs",
    "crates/ecu-sim",
    "crates/app-core",
]
# The Tauri desktop app is its own project (apps/desktop/src-tauri) so that
# building/testing the protocol workspace never requires webkit/GTK system libs.

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/eugibart/eugibart"

[workspace.dependencies]
motodiag-transport = { path = "crates/transport" }
motodiag-kwp2000 = { path = "crates/protocol-kwp2000" }
motodiag-protocol-can = { path = "crates/protocol-can" }
motodiag-ecu-defs = { path = "crates/ecu-defs" }
motodiag-ecu-sim = { path = "crates/ecu-sim" }
motodiag-app-core = { path = "crates/app-core" }

thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
csv = "1"
# default-features off: skip libudev so the workspace builds in bare containers/CI.
# Port enumeration still works via sysfs/IOKit; the desktop app re-enables it.
serialport = { version = "4.7", default-features = false }
