[package]
name = "motodiag-app-core"
description = "Diagnostic session orchestration: connect, DTCs, live data, service ops, safety, logging"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
motodiag-transport = { workspace = true }
motodiag-kwp2000 = { workspace = true }
motodiag-ecu-defs = { workspace = true }
# Only used by the motodiag-discover bin's "simulator" port and by tests;
# a normal (not dev-) dependency because bins don't get dev-dependencies.
motodiag-ecu-sim = { workspace = true }
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
csv.workspace = true
# For the vacuum-gauge serial reader (vacuum.rs); K-line serial I/O itself
# stays behind motodiag-transport's own serialport usage.
serialport.workspace = true

[[bin]]
name = "motodiag-discover"
path = "src/bin/discover.rs"
