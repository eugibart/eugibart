# Community mod guidance: how a modified bike differs from stock.
#
# EVERYTHING in this file is unverified community knowledge by construction —
# the schema has no `verified` field on purpose, and the UI labels every use
# "community reference, unverified". Conditions must self-describe their
# community origin. Keep content minimal and honest: only add an entry where
# forum/tuner consensus genuinely exists (today that's CO/idle behavior on
# open exhausts), never to feel complete.
#
# Matching: an entry applies to a profile iff, for EVERY `requires` field
# present, the profile's value is in the listed set. When several adjustments
# match the same channel, first-in-file wins — order most-specific first.
# Exhaust material (inox/titanium) is deliberately not matchable: it changes
# sound and weight, not fueling.
#
# Cross-validated against the definitions (channel/routine keys must exist);
# DTC codes need NOT be in the definition's table — a mod note is most useful
# exactly for codes we haven't documented.

# ------------- MV Agusta IAW 5SM: open exhaust on the stock EPROM -------------

[[adjustments]]
definition_id = "mv-5sm-brutale-910"

[adjustments.requires]
exhaust = ["slip-on-open", "full-system"]
eprom = ["stock"]

[[adjustments.channel_overrides]]
channel = "rpm"
min = 1150.0
max = 1450.0
condition = "warm idle, neutral, open exhaust on stock EPROM — community reference, unverified"
note = "Open pipes on the stock map commonly idle higher and less evenly than the factory 1100-1300 rpm figure. Community consensus is to accept a slightly higher idle rather than chase the stock number."

# ------- MV Agusta IAW 5SM: dedicated EPROM or custom map (any exhaust) -------

[[adjustments]]
definition_id = "mv-5sm-brutale-910"

[adjustments.requires]
eprom = ["dealer-eprom", "custom-map"]

[[adjustments.channel_overrides]]
channel = "rpm"
min = 1100.0
max = 1400.0
condition = "warm idle, neutral, non-stock EPROM — community reference, unverified; your tuner's figure wins"
note = "With a dedicated EPROM the correct idle is whatever the map was built for. Ask whoever supplied the EPROM for their figure and enter it as your own target — it overrides this range."

# --------------------------- Service procedure caveats ---------------------------

[[procedure_notes]]
definition_id = "mv-5sm-brutale-910"
routine = "co_trim"
note = "Open exhaust: the stock CO target assumes the factory silencers' back-pressure. Sniffer readings at an open silencer read leaner than the engine actually runs — set CO against your tuner's figure (or the EPROM supplier's), not the factory number."

[procedure_notes.requires]
exhaust = ["slip-on-open", "full-system"]

[[procedure_notes]]
definition_id = "mv-5sm-brutale-910"
routine = "co_trim"
note = "Non-stock EPROM: the map already carries its own fueling — a large CO trim on top of it usually means something else is wrong (sync, filter, TPS). Re-check those before trimming."

[procedure_notes.requires]
eprom = ["dealer-eprom", "custom-map"]

[[procedure_notes]]
definition_id = "mv-5sm-brutale-910"
routine = "tps_reset"
note = "High-flow filter: after a TPS reset the ECU relearns idle airflow — expect the idle to wander for the first few minutes of running before settling."

[procedure_notes.requires]
air_filter = ["high-flow"]

# ------------------------------- DTC likely-causes -------------------------------

[[dtc_notes]]
definition_id = "mv-5sm-brutale-910"
code = 0x0171
cause = "Lean mixture from an open exhaust running the stock EPROM map (your mods make this the most likely culprit)"
check = "Before chasing sensors: this code is expected with open pipes on the stock map. A dedicated EPROM or custom map for your exhaust is the real fix; clearing the code without one will only bring it back."

[dtc_notes.requires]
exhaust = ["slip-on-open", "full-system"]
eprom = ["stock"]
