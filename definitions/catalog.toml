# Bike catalog: brand → model → year → ECU definition.
#
# This file drives the "tell me about your bike" wizard. It is purely
# descriptive — nothing here can make the app send a byte. Every
# definition_id is cross-validated against the loaded definitions at test
# time and at app startup (see crates/ecu-defs/src/catalog.rs).
#
# A bike with no definition_id MUST carry a gap_note explaining honestly why
# MotoDiag can't talk to it. Year ranges and ECU mappings are sourced from
# the model lists in the definition files and the coverage table in
# docs/PROTOCOL.md — do not add a mapping that isn't backed there.

# ---------------- MV Agusta — Marelli IAW 5SM family ----------------

