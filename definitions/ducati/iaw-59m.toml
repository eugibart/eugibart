# Ducati — Magneti Marelli IAW 59M / 5.9M (liquid-cooled range, ~2001-2006)
#
# STATUS: UNVERIFIED SCAFFOLD, same standing as the other definitions in this
# repo. Older K-line generation; ISO 9141 5-baud slow init is the standard
# assumption for this era (vs. the 5SM/5AM's fast init) but that too is
# unconfirmed until tested against real hardware. Another "pure reuse" case:
# only slow_init_5baud (already implemented and tested in
# protocol-kwp2000::init) and this data file are involved — no new code.
#
# "59M" and "5.9M" are the same ECU — Marelli's dotted/undotted notation
# (per carmo-electronics.com, ecurepair.com.au, tuneboy.com.au listings).
#
# CORRECTION from earlier versions of this file: the 748, 916, and 996 do
# NOT use this ECU — they run the earlier Weber-Marelli P8 (916 to ~1995)
# and 1.6M/16M generations (per ducati.ms model/ECU thread, bikeboy.org,
# parts listings). Claiming them here risked a false "it connected" on the
# wrong protocol generation. The 5.9M starts with the Testastretta era:
# 996R (2001), 998, 749/999, ST4S, Monster S4, and the twin-spark SS.

[ecu]
id = "ducati-iaw-59m"
name = "Marelli IAW 59M (5.9M)"
manufacturer = "Ducati"
models = [
    "998 (2002-2004)",
    "996R (2001)",
    "749 (2003-2006)",
    "999 (2003-2006)",
    "ST4S (2001-2005)",
    "Monster S4 (2001-2003)",
    "SuperSport 800/1000 DS (2003-2007)",
]
bus = "k-line"
verified = false
notes = """
3-pin FIAT-style diagnostic connector. This ECU generation is old enough that
fast init may not be supported — 5-baud slow init is the working assumption
here and should be the first thing verified on hardware.

Tuning on the 5.9M generation is reflash-based (Nemesis, TuneBoy) — there is
no socketed EPROM chip. The famous chip-swap culture (Ultimap, FIM) belongs
to the earlier P8/1.6M bikes (748/916/996), which this definition does NOT
cover (per ducatimonster.org Nemesis threads, ducati.ms).

749R/999R race variants may carry a different (15RC) unit — unverified; check
the ECU label before assuming this definition applies.
"""

[init]
method = "slow-5-baud"
ecu_address = 0x10
tester_address = 0xF1
baud = 10400

[identification]
request = [0x1A, 0x80]
skip_bytes = 2

[[channels]]
key = "rpm"
name = "Engine speed"
unit = "rpm"
request = [0x21, 0x01]
offset = 2
length = 2
scale = 0.25
verified = false
# Community figure for the desmoquattro/Testastretta family: 1100-1200 rpm
# warm idle, ~1200 recommended (ducati.ms; the discussion is 916-family but
# the target carried over to the 998/749/999 era).
[channels.spec]
min = 1100.0
max = 1200.0
condition = "warm idle, neutral — community figure ~1200 rpm for the desmoquattro family; verify per model"
source = "ducati.ms"
source_url = "https://www.ducati.ms/threads/82816/"

[[channels]]
key = "tps"
name = "Throttle position"
unit = "%"
request = [0x21, 0x02]
offset = 2
length = 2
scale = 0.0015259
verified = false
# The single most-cited setup figure in this community: Marelli non-linear
# TPS baseline = 150 mV at fully closed throttle (147-152 mV repeatable),
# then the idle stop is wound to ~380-390 mV (748R 2.2°, 996R/998 2.3°) —
# Brad Black / BikeBoy.org, mirrored widely on ducati.ms.
[channels.spec]
min = 0.0
max = 3.0
condition = "throttle fully closed — Marelli baseline 150 mV ≈ 3%; idle stop ~380-390 mV (748R 2.2°, 996R/998 2.3°) per BikeBoy"
source = "bikeboy.org (Brad Black)"
source_url = "https://bradthebikeboy.blogspot.com/2014/01/996r-and-998-and-748r-non-linear-tps.html"

[[channels]]
key = "ect"
name = "Coolant temperature"
unit = "°C"
request = [0x21, 0x03]
offset = 2
length = 1
scale = 1.0
offset_value = -40.0
verified = false

[[channels]]
key = "batt"
name = "Battery voltage"
unit = "V"
request = [0x21, 0x05]
offset = 2
length = 1
scale = 0.0625
verified = false
# Charging on this family is a notorious weak point (pre-1998-design
# rectifiers failed en masse; yellow stator-wire connectors melt). Healthy:
# rises with rpm to ~13.8-14.2 V by 3000-4000 rpm; ~13.5 V is minimum
# adequate. Voltage that WON'T CLIMB with revs = heat-damaged stator
# windings or melted connectors, even if it reads "OK" at idle.
[channels.spec]
min = 13.5
max = 14.4
condition = "engine running at 3000-4000 rpm — should reach 13.8-14.2 V; voltage that won't climb with revs = stator/connectors"
source = "ducati.ms"
source_url = "https://www.ducati.ms/threads/750075/"

# Guided charging-system test — the 916-era family's notorious weak point
# (pre-1998-design rectifiers failed en masse; yellow stator-wire connectors
# melt). Community figures (ducati.ms): healthy rises with rpm to
# ~13.8-14.2 V by 3000-4000 rpm; ~13.5 V is minimum adequate; the classic
# failure signature is voltage that WON'T CLIMB with revs.
[charging]
rest_min_v = 12.4
charging_min_v = 13.5
charging_max_v = 14.4
check_rpm_min = 3000.0
check_rpm_max = 4200.0
stator_notes = "If voltage won't climb with revs even though it reads OK at idle, suspect heat-damaged stator windings or the melted yellow stator-wire connectors — the community fix is to solder those joints and delete the connectors. A regulator bench-tested at ~2000 rpm should output ~25-30 V AC."
source = "ducati.ms"
source_url = "https://www.ducati.ms/threads/750075/"

[dtc]
read_request = [0x18, 0x02, 0xFF, 0x00]
clear_request = [0x14, 0xFF, 0x00]

[[dtc.table]]
code = 0x0115
description = "Throttle position sensor — signal implausible (placeholder)"
causes = [
    "TPS connector corrosion or loose pin",
    "TPS out of adjustment",
    "Worn TPS track (high-mileage bikes)",
]
checks = [
    "Unplug the TPS connector, inspect for corrosion, clean with contact cleaner",
    "With key on, watch the TPS live-data channel for dropouts while sweeping the throttle",
]

[[routines]]
key = "fuel_pump_test"
name = "Fuel pump actuator test"
description = "Run the fuel pump briefly to verify operation."
risk = "low"
request = [0x30, 0x01, 0x01]
verified = false
[routines.preconditions]
engine_must_be_off = true
min_battery_v = 11.5
