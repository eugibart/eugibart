# Ducati — Magneti Marelli IAW 5AM (air-cooled 2-valve range, ~2005-2010)
#
# STATUS: UNVERIFIED SCAFFOLD, same standing as the Brutale 910's 5SM
# definition (see that file's header). K-line/KWP2000, same Marelli IAW
# family as the 5SM — this is the "pure reuse" case from the M5 milestone:
# the transport, protocol-kwp2000, and app-core layers work unmodified
# against this file; only the data below is new. Nothing here has been
# confirmed against a real Ducati yet.
#
# Model list sourced from the TuneBoy/DynoDom 5AM applications list
# (https://www.tuneboy.com.au/ducati_marelli/) and ducati.ms's model/ECU
# thread. IMPORTANT boundary: the 2010+ small bikes (Monster 696 from 2011,
# Monster 796, 1100 EVO, Hypermotard 796 and 1100 EVO) moved to a
# Siemens/Continental M3C ECU — NOT this definition.

[ecu]
id = "ducati-iaw-5am"
name = "Marelli IAW 5AM"
manufacturer = "Ducati"
models = [
    "Monster 620 (2005-2006)",
    "Monster 695 (2006-2008)",
    "Monster 696 (2008-2010)",
    "Monster 1000 (2005-2006)",
    "Monster 1100 (2009-2010)",
    "Monster S2R 800 (2005-2007)",
    "Monster S2R 1000 (2006-2008)",
    "Monster S4RS (2006-2008)",
    "Multistrada 620 (2005-2006)",
    "Multistrada 1100/1100S (2007-2009)",
    "Hypermotard 1100/1100S (2007-2009)",
    "SportClassic GT1000 / Sport 1000 / PaulSmart 1000 (2006-2010)",
]
bus = "k-line"
verified = false
notes = """
3-pin FIAT-style diagnostic connector (same family as MV's), typically under
the seat or near the battery. Only K-line, +12V, and GND are needed. Confirm
pinout and connector location against the workshop manual before connecting.

Dash self-diagnosis exists on these bikes (hold the left dash button while
switching ignition on): codes group as 1.x TPS, 2.x pressure, 3.x coolant
temp, 4.x air temp, 5.1/5.2 battery high/low, 6.x lambda (per
ducatimonster.org and ducati.ms owner threads). Those dash codes do NOT map
1:1 onto the KWP fault codes this definition reads — treat them as a
cross-check, not the same numbering.

2011+ Monster 696/796, Monster 1100 EVO, and Hypermotard 796/1100 EVO use a
Siemens/Continental M3C ECU — this definition does not apply to them.
"""

[init]
method = "fast"
ecu_address = 0x10
tester_address = 0xF1
baud = 10400

[identification]
request = [0x1A, 0x80]
skip_bytes = 2

[[channels]]
key = "rpm"
name = "Engine speed"
unit = "rpm"
request = [0x21, 0x01]
offset = 2
length = 2
scale = 0.25
verified = false
# Corrected from an earlier generic L-twin guess (1050-1150): the Monster
# 696 owner's manual figure is 1300 ±50 rpm, corroborated across
# ducatimonster.org idle threads; Monster 1100 owners report the same band.
# Idle is set mechanically via the throttle-body bypass screws (~1/4 turn
# steps, engine fully warm), not through the ECU.
[channels.spec]
min = 1250.0
max = 1350.0
condition = "warm idle (coolant >100 °C), neutral — Monster 696 manual figure 1300 ±50 rpm, community-corroborated; verify per model"
source = "ducatimonster.org"
source_url = "https://www.ducatimonster.org/threads/229754/"

[[channels]]
key = "tps"
name = "Throttle position"
unit = "%"
request = [0x21, 0x02]
offset = 2
length = 2
scale = 0.0015259
verified = false

[[channels]]
key = "ect"
name = "Coolant temperature"
unit = "°C"
request = [0x21, 0x03]
offset = 2
length = 1
scale = 1.0
offset_value = -40.0
verified = false

[[channels]]
key = "batt"
name = "Battery voltage"
unit = "V"
request = [0x21, 0x05]
offset = 2
length = 1
scale = 0.0625
verified = false
[channels.spec]
min = 13.0
max = 14.8
condition = "engine running above idle, healthy charging system, unverified"

[dtc]
read_request = [0x18, 0x02, 0xFF, 0x00]
clear_request = [0x14, 0xFF, 0x00]

[[dtc.table]]
code = 0x0115
description = "Throttle position sensor — signal implausible (placeholder)"
causes = [
    "TPS connector corrosion or loose pin",
    "TPS out of adjustment after throttle body service",
    "Worn TPS track (high-mileage bikes)",
    "Damaged wiring between TPS and ECU",
]
checks = [
    "Unplug the TPS connector, inspect for corrosion, clean with contact cleaner",
    "With key on, watch the TPS live-data channel: sweep the throttle slowly and look for dropouts",
    "Run the TPS reset routine after any throttle body work",
]

[[dtc.table]]
code = 0x0335
description = "Crankshaft position sensor — no signal (placeholder)"
causes = [
    "Crank sensor connector unplugged or corroded",
    "Sensor-to-flywheel air gap out of spec",
    "Failed crank position sensor",
]
checks = [
    "Check connector seating and pins at the sensor",
    "Verify sensor air gap against the workshop manual spec",
    "Inspect wiring for chafing near the engine cases",
]

[[routines]]
key = "tps_reset"
name = "Throttle position (TPS) reset"
description = "Re-learn the closed-throttle position. Engine must be off, throttle fully closed."
procedure = [
    "This is the electronic 'throttle body reset' the community runs via diagnostic software (IAWDiag exposes it under the '5AM PF2C' ECU profile, fast init — per ducati.ms)",
    "A physically REPLACED TPS must first be set by millivolts on a multimeter — the electronic reset only re-zeros a known-good, correctly-mounted sensor (per ducati.ms TPS threads)",
    "Warm the engine to operating temperature, then switch it off (key on, engine off for the reset itself)",
    "Confirm the throttle is fully closed and the cable has correct freeplay — do not touch the throttle during the reset",
    "Run this routine and wait for the ECU to confirm completion",
    "Key off, then back on; verify the TPS live-data reading sits within its closed-throttle spec",
]
risk = "medium"
request = [0x31, 0x01]
verified = false
[routines.preconditions]
engine_must_be_off = true
min_battery_v = 12.0
max_battery_v = 14.8
notes = "Throttle must be fully closed and untouched during the reset."

[[routines]]
key = "fuel_pump_test"
name = "Fuel pump actuator test"
description = "Run the fuel pump briefly to verify operation."
risk = "low"
request = [0x30, 0x01, 0x01]
verified = false
[routines.preconditions]
engine_must_be_off = true
min_battery_v = 11.5
