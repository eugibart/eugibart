# MV Agusta — Magneti Marelli IAW 5SM (shared across the pre-Euro3 F4/Brutale range)
#
# STATUS: UNVERIFIED SCAFFOLD. The bus type, init method, and baud rate follow
# well-documented Marelli IAW practice (JPDiag/GuzziDiag family), but the
# addresses, local identifiers, scalings, and routine byte sequences below are
# educated placeholders. Each carries `verified = false` until it has been
# confirmed against a real bike — by sniffing JPDiag with a serial tap and by
# direct probing (milestones M1/M4). Do not trust a value until its flag flips.
#
# MODEL COVERAGE — the IAW 5SM is fitted across the whole first-generation
# F4/Brutale range once they moved off the earlier 1.6M ECU, so one definition
# genuinely covers all of them (confirmed via ECU-repair/tuning listings, not
# assumed): Brutale 750, 910/910R, 989 R, 1078 RR, and F4 750 (2003+)/1000/1000R.
# See docs/PROTOCOL.md for the full MV model-coverage table, including what
# this file does *not* cover.

[ecu]
id = "mv-5sm-brutale-910"
name = "Marelli IAW 5SM (F4/Brutale range)"
manufacturer = "MV Agusta"
models = [
    "Brutale 750 (2003-2007)",
    "Brutale 910/910R/910S (2005-2008)",
    "Brutale 989 R",
    "Brutale 1078 RR",
    "F4 750 (2003+, 5SM ECU)",
    "F4 1000/1000R",
]
bus = "k-line"
verified = false
notes = """
Diagnostic connector: 3-pin (K-line, +12V, GND) reported under the tank on the
right side; some bikes may use the 4-pin connector under the seat instead.
Verify against the workshop manual wiring diagram before first connection —
see docs/MV-PINOUT.md. Connector location/wiring may vary by model year —
confirm per bike, don't assume the Brutale 910's layout applies unchanged.
"""

[init]
method = "fast"       # KWP2000 fast init (25 ms low / 25 ms high wake-up)
ecu_address = 0x10    # placeholder: common Marelli engine-ECU address
tester_address = 0xF1
baud = 10400

[timing]
# Start from ISO defaults; tighten/loosen from real traces in M1.

[identification]
request = [0x1A, 0x80]  # ReadEcuIdentification, all data tables
skip_bytes = 2

# ---------------------------------------------------------------------------
# Live data channels (ReadDataByLocalIdentifier 0x21).
# Local IDs and scalings are placeholders pending M1/M2 discovery.
# ---------------------------------------------------------------------------

[[channels]]
key = "rpm"
name = "Engine speed"
unit = "rpm"
request = [0x21, 0x01]
offset = 2
length = 2
scale = 0.25
verified = false
# MV FAQ (Brad@Moto-One, the community's reference tuner) gives the F4 1000
# idle target as 1150 ±50 rpm; the Brutale family runs the same band. Still
# unverified on the wire against a real ECU, but no longer a generic guess.
[channels.spec]
min = 1100.0
max = 1200.0
condition = "warm idle, neutral — F4 1000 target 1150 ±50 rpm per MV FAQ; Brutale family similar, verify per model"
source = "mvfaq.blogspot.com"
source_url = "https://mvfaq.blogspot.com/2005/11/tuning-4-f4-1000-idle-throttle.html"

[[channels]]
key = "tps"
name = "Throttle position"
unit = "%"
request = [0x21, 0x02]
offset = 2
length = 2
scale = 0.0015259  # 100 / 65535
verified = false
# Marelli non-linear TPS baseline: ~150 mV fully closed (≈3% of a 5 V
# sensor); at the idle stop the MV FAQ quotes Brutale 750 = 1.5–1.7°
# (315–335 mV) and Brutale 910 = 1.9–2.5°.
[channels.spec]
min = 0.0
max = 3.0
condition = "throttle fully closed — Marelli baseline ~150 mV ≈ 3%; idle stop: Brutale 750 1.5–1.7° (315–335 mV), 910 1.9–2.5° per MV FAQ"
source = "mvfaq.blogspot.com"
source_url = "https://mvfaq.blogspot.com/2005/12/tuning-1-throttle-position-sensor-tps.html"

[[channels]]
key = "ect"
name = "Coolant temperature"
unit = "°C"
request = [0x21, 0x03]
offset = 2
length = 1
scale = 1.0
offset_value = -40.0
verified = false
[channels.spec]
min = 80.0
max = 105.0
condition = "engine at operating temperature, thermostat open, unverified"

[[channels]]
key = "iat"
name = "Intake air temperature"
unit = "°C"
request = [0x21, 0x04]
offset = 2
length = 1
scale = 1.0
offset_value = -40.0
verified = false

[[channels]]
key = "batt"
name = "Battery voltage"
unit = "V"
request = [0x21, 0x05]
offset = 2
length = 1
scale = 0.0625
verified = false
# The Brutale charging system is a notorious weak point. Community figures:
# healthy is 14–15 V DC at the battery with the engine running, regulator
# capping ~14.5 V — and CHECK AT ~2000 RPM, NOT IDLE. Stator sanity check:
# ~1 Ω between each phase pair; 20–30 V AC at idle rising to 60–70 V revved.
# Good AC from the stator but <14 V at the battery = regulator/rectifier.
[channels.spec]
min = 13.5
max = 15.0
condition = "engine running, checked at ~2000 rpm (not idle) — regulator should cap ~14.5 V; won't reach 14 V = reg/rec or stator"
source = "mvagusta.net"
source_url = "https://www.mvagusta.net/threads/regulator-rectifier.231393/"

[[channels]]
key = "map"
name = "Manifold pressure"
unit = "mbar"
request = [0x21, 0x06]
offset = 2
length = 2
scale = 1.0
verified = false

# ---------------------------------------------------------------------------
# Guided charging-system test
# ---------------------------------------------------------------------------
# The Brutale/F4 charging system (stator + regulator/rectifier) is the
# marque's most notorious weak point. Figures from mvagusta.net charging
# threads: healthy is 14-15 V DC at the battery with the engine running,
# regulator capping ~14.5 V, and it must be CHECKED AT ~2000 RPM, NOT IDLE.
# Resting battery ~13.2 V healthy; ~12 V won't reliably start.

[charging]
rest_min_v = 12.4
charging_min_v = 14.0
charging_max_v = 15.0
check_rpm_min = 1800.0
check_rpm_max = 2600.0
stator_notes = "Stator sanity check: ~1 Ω between each pair of the 3 phase wires; AC output 20-30 V at idle rising to 60-70 V with revs. If the stator's AC output is good but the battery never sees 14+ V DC, the regulator/rectifier is the culprit; if several reg/recs give the same bad result, it's the stator."
source = "mvagusta.net"
source_url = "https://www.mvagusta.net/threads/regulator-rectifier.231393/"

# ---------------------------------------------------------------------------
# Fault codes
# ---------------------------------------------------------------------------

[dtc]
read_request = [0x18, 0x02, 0xFF, 0x00]  # ReadDTCByStatus: all identified DTCs
clear_request = [0x14, 0xFF, 0x00]       # ClearDiagnosticInformation: all groups

# DTC meanings to be populated from the workshop manual / JPDiag captures.
# The causes/checks lists are general Marelli-IAW/Brutale workshop knowledge —
# keep them practical and ordered most-likely-first.
[[dtc.table]]
code = 0x0115
description = "Throttle position sensor — signal implausible (placeholder)"
causes = [
    "TPS connector corrosion or loose pin (exposed to spray on the throttle bodies)",
    "TPS out of adjustment after throttle body service",
    "Worn TPS track (high-mileage bikes)",
    "Damaged wiring between TPS and ECU",
]
checks = [
    "Unplug the TPS connector, inspect for green corrosion, clean with contact cleaner",
    "With key on, watch the TPS live-data channel: sweep the throttle slowly and look for dropouts",
    "Run the TPS reset routine after any throttle body work",
]

[[dtc.table]]
code = 0x0120
description = "Coolant temperature sensor — open/short circuit (placeholder)"
causes = [
    "Sensor connector unplugged or corroded",
    "Failed coolant temperature sensor (reads open circuit)",
    "Chafed wiring near the thermostat housing",
]
checks = [
    "Compare the coolant temp live-data value against ambient with a cold engine — a stuck -40°C reading means open circuit",
    "Check connector seating and pins at the sensor",
    "Measure sensor resistance cold vs warm against the workshop manual table",
]

# ---------------------------------------------------------------------------
# Service routines. Requests are placeholders until sniffed from JPDiag (M4);
# the safety preconditions are enforced by app-core regardless.
# ---------------------------------------------------------------------------

[[routines]]
key = "tps_reset"
name = "Throttle position (TPS) reset"
description = "Re-learn the closed-throttle position. Engine must be off, throttle fully closed."
procedure = [
    "On the 5SM the TPS reset is SOFTWARE-ONLY — do not set the sensor by hand with a multimeter; the manual 150 mV setup applies to the earlier 1.6M-ECU bikes (per mvfaq.blogspot.com, mvagusta.net)",
    "Warm the engine to operating temperature, then switch it off (key on, engine off for the reset itself)",
    "Confirm the throttle is fully closed and the cable has correct freeplay — do not touch the throttle during the reset",
    "Run this routine and wait for the ECU to confirm completion",
    "Key off, then back on; verify the TPS live-data reading sits within its closed-throttle spec (see the tps channel)",
    "If sync work (vacuometro) is planned, do it before this reset, not after — TPS reset assumes balanced throttle bodies",
]
risk = "medium"
request = [0x31, 0x01]
verified = false
[routines.preconditions]
engine_must_be_off = true
min_battery_v = 12.0
max_battery_v = 14.8
notes = "Throttle must be fully closed and untouched during the reset."

[[routines]]
key = "fuel_pump_test"
name = "Fuel pump actuator test"
description = "Run the fuel pump briefly to verify operation."
risk = "low"
request = [0x30, 0x01, 0x01]
verified = false
[routines.preconditions]
engine_must_be_off = true
min_battery_v = 11.5

[[routines]]
key = "cooling_fan_test"
name = "Cooling fan actuator test"
description = "Switch the radiator fan on briefly."
risk = "low"
request = [0x30, 0x02, 0x01]
verified = false
[routines.preconditions]
engine_must_be_off = true
min_battery_v = 11.5

[[routines]]
key = "co_trim"
name = "CO trim adjustment"
description = "Adjust idle CO trim. Persisted by the ECU — follow the workshop procedure."
procedure = [
    "The 5SM has NO physical CO trimmer — CO is a software fuel trim set via diagnostics; the trimmer/dashpot belongs to the earlier 1.6M ECU (per mvfaq.blogspot.com). Community CO target: 3.5 ±0.5% at idle",
    "Sync the throttle bodies FIRST (Sync tab, vacuometro) — CO trim on unbalanced bodies chases a moving target. Air-bleed screws interact: opening one changes CO and idle together",
    "Warm the engine fully; idle should already be within its RPM spec (see the rpm channel) before touching CO",
    "Connect an exhaust gas analyzer if available — this routine adjusts ECU trim, it does not measure exhaust CO itself",
    "Run this routine in small increments, re-checking idle RPM and analyzer reading between each",
    "Re-verify sync hasn't drifted after the adjustment; recheck fault codes afterward",
]
risk = "high"
request = [0x31, 0x02]
verified = false
[routines.preconditions]
min_battery_v = 12.0
max_battery_v = 14.8
notes = "Engine at operating temperature, exhaust gas analyzer recommended."
